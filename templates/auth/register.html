{% extends "base.html" %}

{% block title %}Register - Medi-Finder{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Create Account</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="name" name="name" 
                                       value="{{ form_data.name if form_data }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="{{ form_data.email if form_data }}" required>
                                <div class="form-text" id="emailAvailability"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                                <div class="form-text">Minimum 6 characters</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Account Type</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="user_type" 
                                   id="customer" value="customer" 
                                   {{ 'checked' if not form_data or form_data.user_type == 'customer' }}>
                            <label class="form-check-label" for="customer">
                                Customer
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="user_type" 
                                   id="pharmacy_admin" value="pharmacy_admin"
                                   {{ 'checked' if form_data and form_data.user_type == 'pharmacy_admin' }}>
                            <label class="form-check-label" for="pharmacy_admin">
                                Pharmacy Owner/Admin
                            </label>
                        </div>
                    </div>
                    
                    <!-- Pharmacy Details (shown only for pharmacy admin) -->
                    <div id="pharmacyDetails" style="display: none;">
                        <div class="border-top pt-3 mt-3">
                            <h5 class="text-primary">Pharmacy Information</h5>
                            
                            <div class="mb-3">
                                <label for="pharmacy_name" class="form-label">Pharmacy Name</label>
                                <input type="text" class="form-control" id="pharmacy_name" name="pharmacy_name"
                                       value="{{ form_data.pharmacy_name if form_data }}">
                            </div>
                            
                            <div class="mb-3">
                                <label for="pharmacy_address" class="form-label">Pharmacy Address</label>
                                <textarea class="form-control" id="pharmacy_address" name="pharmacy_address" 
                                          rows="3">{{ form_data.pharmacy_address if form_data }}</textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="pharmacy_contact" class="form-label">Contact Number</label>
                                <input type="tel" class="form-control" id="pharmacy_contact" name="pharmacy_contact"
                                       value="{{ form_data.pharmacy_contact if form_data }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                        <label class="form-check-label" for="terms">
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">
                        <i class="fas fa-user-plus me-2"></i>Create Account
                    </button>
                </form>
                
                <hr>
                
                <div class="text-center">
                    <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Show/hide pharmacy details based on account type
document.querySelectorAll('input[name="user_type"]').forEach(radio => {
    radio.addEventListener('change', function() {
        const pharmacyDetails = document.getElementById('pharmacyDetails');
        pharmacyDetails.style.display = this.value === 'pharmacy_admin' ? 'block' : 'none';
    });
});

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    const selectedType = document.querySelector('input[name="user_type"]:checked');
    if (selectedType && selectedType.value === 'pharmacy_admin') {
        document.getElementById('pharmacyDetails').style.display = 'block';
    }
});

// Email availability check
document.getElementById('email').addEventListener('blur', async function() {
    const email = this.value;
    const availabilityDiv = document.getElementById('emailAvailability');
    
    if (!email) return;
    
    try {
        const response = await fetch(`/auth/api/check-email?email=${encodeURIComponent(email)}`);
        const data = await response.json();
        
        if (data.status === 'success') {
            if (data.data.available) {
                availabilityDiv.innerHTML = '<span class="text-success"><i class="fas fa-check"></i> Email available</span>';
            } else {
                availabilityDiv.innerHTML = '<span class="text-danger"><i class="fas fa-times"></i> Email already registered</span>';
            }
        }
    } catch (error) {
        console.error('Email check error:', error);
    }
});

// Form validation
document.getElementById('registerForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const userType = document.querySelector('input[name="user_type"]:checked').value;
    
    if (password !== confirmPassword) {
        e.preventDefault();
        alert('Passwords do not match!');
        return;
    }
    
    if (password.length < 6) {
        e.preventDefault();
        alert('Password must be at least 6 characters long!');
        return;
    }
    
    if (userType === 'pharmacy_admin') {
        const pharmacyName = document.getElementById('pharmacy_name').value;
        const pharmacyAddress = document.getElementById('pharmacy_address').value;
        const pharmacyContact = document.getElementById('pharmacy_contact').value;
        
        if (!pharmacyName || !pharmacyAddress || !pharmacyContact) {
            e.preventDefault();
            alert('Please fill in all pharmacy details');
            return;
        }
    }
});
</script>
{% endblock %}
