{% extends "base.html" %}

{% block title %}Prescription Upload - Medi-Finder{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-upload me-2"></i>Prescription Upload</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted">Upload your prescription for OCR processing and medicine extraction.</p>

                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="prescriptionFile" class="form-label">Select Prescription Image</label>
                            <input type="file" class="form-control" id="prescriptionFile" name="prescription" accept="image/*" required>
                            <div class="form-text">Supported formats: JPG, PNG, PDF</div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="agreeCheck" required>
                                <label class="form-check-label" for="agreeCheck">
                                    I agree to the terms and conditions for uploading medical documents.
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" id="uploadBtn">
                            <i class="fas fa-upload me-2"></i>Upload and Process
                        </button>
                    </form>

                    <div id="result" class="mt-4" style="display: none;">
                        <h5>Extracted Information:</h5>
                        <div id="extractedText" class="alert alert-info"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('uploadForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const uploadBtn = document.getElementById('uploadBtn');
    const resultDiv = document.getElementById('result');
    const extractedText = document.getElementById('extractedText');
    const errorDiv = document.getElementById('errorMessage');

    // Hide previous results and errors
    resultDiv.style.display = 'none';
    if (errorDiv) errorDiv.style.display = 'none';

    uploadBtn.disabled = true;
    uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Processing...';

    try {
        const response = await fetch('/api/process-prescription', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (data.status === 'success') {
            // Show extracted medicines
            extractedText.innerHTML = `<strong>Extracted Medicines:</strong><br>${data.data.formatted_medicines.replace(/\n/g, '<br>')}`;
            resultDiv.style.display = 'block';

            // Add pharmacy search integration
            addPharmacySearch(data.data.medicines);
        } else {
            // Show error message
            showError(data.message || 'Failed to process prescription');
        }
    } catch (error) {
        console.error('Error:', error);
        showError('Network error. Please try again.');
    } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = '<i class="fas fa-upload me-2"></i>Upload and Process';
    }
});

function showError(message) {
    let errorDiv = document.getElementById('errorMessage');
    if (!errorDiv) {
        errorDiv = document.createElement('div');
        errorDiv.id = 'errorMessage';
        errorDiv.className = 'alert alert-danger mt-3';
        document.querySelector('.card-body').appendChild(errorDiv);
    }

    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
}

function addPharmacySearch(medicines) {
    // Create pharmacy search section
    const searchSection = document.createElement('div');
    searchSection.id = 'pharmacySearch';
    searchSection.className = 'mt-4';
    searchSection.innerHTML = `
        <h5>Find Nearby Pharmacies:</h5>
        <div class="input-group mb-3">
            <input type="text" id="userLocation" class="form-control" placeholder="Enter your location (optional)">
            <button class="btn btn-outline-secondary" type="button" onclick="getCurrentLocation()">
                <i class="fas fa-location-dot"></i> Use Current Location
            </button>
        </div>
        <div class="input-group mb-3">
            <input type="number" id="searchDistance" class="form-control" placeholder="Distance (km)" value="10" min="1" max="50">
            <button class="btn btn-primary" type="button" onclick="searchPharmacies()">
                <i class="fas fa-search"></i> Search Pharmacies
            </button>
        </div>
        <div id="pharmacyResults" class="mt-3" style="display: none;">
            <h6>Available Pharmacies:</h6>
            <div id="pharmacyList" class="list-group"></div>
        </div>
    `;

    document.getElementById('result').appendChild(searchSection);
}

async function getCurrentLocation() {
    if (navigator.geolocation) {
        try {
            const position = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: 10000
                });
            });

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            document.getElementById('userLocation').value = `${lat}, ${lng}`;
        } catch (error) {
            console.error('Error getting location:', error);
            alert('Could not get your location. Please enter it manually.');
        }
    } else {
        alert('Geolocation is not supported by this browser.');
    }
}

async function searchPharmacies() {
    const medicines = getExtractedMedicineNames();
    const locationInput = document.getElementById('userLocation').value;
    const distance = document.getElementById('searchDistance').value;

    if (!medicines.length) {
        alert('No medicines extracted from prescription.');
        return;
    }

    let lat, lng;
    if (locationInput) {
        // Try to parse coordinates or address
        const coords = locationInput.split(',');
        if (coords.length === 2) {
            lat = parseFloat(coords[0].trim());
            lng = parseFloat(coords[1].trim());
        }
    }

    try {
        const response = await fetch('/api/search-pharmacies', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                medicines: medicines,
                lat: lat,
                lng: lng,
                distance: parseFloat(distance)
            })
        });

        const data = await response.json();

        if (data.status === 'success') {
            displayPharmacyResults(data.data.results);
        } else {
            alert(data.message || 'Failed to search pharmacies');
        }
    } catch (error) {
        console.error('Error searching pharmacies:', error);
        alert('Network error. Please try again.');
    }
}

function getExtractedMedicineNames() {
    // Get medicine names from the extracted text
    const extractedText = document.getElementById('extractedText').innerHTML;
    const medicineNames = [];

    // Simple parsing - extract medicine names from the formatted text
    const lines = extractedText.split('<br>');
    for (const line of lines) {
        const match = line.match(/\d+\.\s*([^0-9-]+)/);
        if (match) {
            const name = match[1].trim();
            if (name && name !== 'Unknown') {
                medicineNames.push(name);
            }
        }
    }

    return medicineNames;
}

function displayPharmacyResults(results) {
    const pharmacyList = document.getElementById('pharmacyList');
    const pharmacyResults = document.getElementById('pharmacyResults');

    if (!results || results.length === 0) {
        pharmacyList.innerHTML = '<div class="list-group-item">No pharmacies found with the required medicines.</div>';
        pharmacyResults.style.display = 'block';
        return;
    }

    let html = '';
    for (const result of results) {
        const distance = result.distance ? `${result.distance.toFixed(1)} km` : 'Distance unknown';
        html += `
            <div class="list-group-item">
                <div class="d-flex w-100 justify-content-between">
                    <h6 class="mb-1">${result.pharmacy.name}</h6>
                    <small>${distance}</small>
                </div>
                <p class="mb-1">
                    <strong>${result.medicine.name}</strong><br>
                    <small class="text-muted">${result.pharmacy.address}</small>
                </p>
                <div class="d-flex justify-content-between align-items-center">
                    <small class="text-success">
                        Available: ${result.availability.stock} units at ₹${result.availability.price}
                    </small>
                    <button class="btn btn-sm btn-outline-primary" onclick="showOnMap(${result.pharmacy.latitude}, ${result.pharmacy.longitude})">
                        <i class="fas fa-map"></i> View on Map
                    </button>
                </div>
            </div>
        `;
    }

    pharmacyList.innerHTML = html;
    pharmacyResults.style.display = 'block';
}

function showOnMap(lat, lng) {
    // Open Google Maps or similar mapping service
    const url = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
    window.open(url, '_blank');
}
</script>
{% endblock %}
